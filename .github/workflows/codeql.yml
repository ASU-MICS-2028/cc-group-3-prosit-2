name: codeql

# Static analysis of our own code (D-030): injection, unsafe deserialisation, path traversal and the like.
# Free for public repositories; results appear under Security → Code scanning.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1" # Mondays: new queries find old bugs too

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
